name: AWS Deployment Workflow

on:
  pull_request:
  push:
    branches:
      - main

# REQUIRED: Allows GitHub to issue an OIDC JWT token
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Debug OIDC Token Claims
        run: |
          ACTIONS_ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "Decoding JWT Payload:"
          echo "$ACTIONS_ID_TOKEN" | jq -R 'split(".") | .[1] | @base64d | fromjson'
          
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_NUMBER }}:role/deploy-stack-role
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Test AWS Connection
        run: |
          aws sts get-caller-identity
