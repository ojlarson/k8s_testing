name: continuous integration

on:
  pull_request: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1
        
      - name: Helm Lint and Kubeconform
        run: make helm-check

      - name: Docker build and smoke test
        run: make smoke-image

      - name: deploy into cluster
        run: make helm-deploy

      - name: validate cluster
        run: make smoke-kind
      
      - name: Validate Gateway
        run: make smoke-gateway

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods,svc,endpoints -A
          kubectl get gateway,httproute -A
          kubectl describe httproute -A
          kubectl describe gateway -A
          helm list -A
          kubectl logs -n default deploy/gateway-nginx --tail=50 || true
          kubectl logs -n test -l app.kubernetes.io/name=hello-api --tail=50 || true