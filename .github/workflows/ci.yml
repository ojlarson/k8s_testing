name: continuous integration

on:
  pull_request: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Docker build and smoke test
        run: make smoke

      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      - name: Validate k8s Deployment
        run: make kubeconform

      - name: deploy into cluster
        run: |
          make kube-deploy
