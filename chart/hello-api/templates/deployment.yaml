apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api

spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-api

  template:
    metadata:
      labels:
        app: hello-api
    spec:
      containers:
        - name: hello-api
          image: {{ .Values.helloImage }}
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: hello-config
          env:
            - name: KUBE_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KUBE_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          resources:
            limits:
              cpu: "500m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            initialDelaySeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsNonRoot: True
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8000