apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  parentRefs:
  - name: {{ .Values.route.gatewayName }}
    namespace: {{ .Values.route.gatewayNamespace }}
    sectionName: http
  hostnames:
  - {{ .Values.route.hostname | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: {{ include "chart.fullname" . }}
      port: 80